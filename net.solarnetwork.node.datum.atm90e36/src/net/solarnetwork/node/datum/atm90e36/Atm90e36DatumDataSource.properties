title = ATM90E36 Energy Meter
desc = Generate datum from an embedded ATM90E36 energy meter.

sourceId.key = Source ID
sourceId.desc = The Source ID to use for the generated datum.

datumStatus.key = Latest Datum
datumStatus.desc = An overview of the last-generated datum.

spiBus.key = SPI Bus
spiBus.desc = The SPI bus number the meter chip is attached to: the first number in a \
	device name like <code>/dev/spidev0.0</code>.

spiChip.key = SPI Chip
spiChip.desc = The SPI chip-select number the meter chip answers on: the second number in \
	a device name like <code>/dev/spidev0.0</code>.

config.lineFrequency.key = Line Frequency
config.lineFrequency.desc = The frequency of the mains supply being metered. The chip uses \
	different processing parameters for each, so set this to match the real supply.

LineFrequency.HZ_50 = 50Hz
LineFrequency.HZ_60 = 60Hz

config.wiring.key = Wiring
config.wiring.desc = How the meter is connected to the service. Four-wire measures each phase \
	against neutral; three-wire uses phase B as the reference, so the phase A and C channels \
	measure the A-B and C-B line voltages and phase B itself is not measured.

Wiring.THREE_PHASE_FOUR_WIRE = Three phase, four wire (3P4W)
Wiring.THREE_PHASE_THREE_WIRE = Three phase, three wire (3P3W)

summedPhasesValue.key = Connected Phases
summedPhasesValue.desc = The phases actually connected, as letters like <code>a,c</code>. Only \
	these are added into the all-phase totals, and only these are published as per-phase \
	properties. A three-wire service uses <code>a,c</code>; a four-wire service with all three \
	phases connected uses <code>a,b,c</code>.

config.currentSensor.key = Current Sensor
config.currentSensor.desc = The type of sensor measuring the current.

CurrentSensor.CURRENT_TRANSFORMER = CT (current transformer)
CurrentSensor.ROGOWSKI_COIL = Rogowski coil

config.currentChannelsSwapped.key = Swap I1/I3
config.currentChannelsSwapped.desc = Map current input I1 to phase C and I3 to phase A, to \
	compensate for the chip being mounted on the opposite side of the circuit board. I2 always \
	maps to phase B.

config.meterConstant.key = Meter Constant
config.meterConstant.desc = Pulses per kilowatt-hour, which sets the energy each register count \
	represents. Must match the meter's design; changing it rescales all energy values.

config.highResolutionEnergy.key = High Energy Resolution
config.highResolutionEnergy.desc = Accumulate energy in steps of 0.01 pulses instead of 0.1, for \
	ten times the resolution. Each register then holds a tenth as much before it runs out, so \
	read the meter more often when enabled.

config.highPassFilterEnabled.key = High Pass Filter
config.highPassFilterEnabled.desc = Filter the DC component out of the sampled signals. Turn \
	this off only to measure DC.

config.activePowerSum.key = Active Power Sum
config.activePowerSum.desc = How per-phase active power and energy combine into the totals. \
	Signed lets reverse flow cancel forward flow; absolute adds the two together.

config.reactivePowerSum.key = Reactive Power Sum
config.reactivePowerSum.desc = How per-phase reactive power and energy combine into the totals. \
	Signed lets reverse flow cancel forward flow; absolute adds the two together.

SumMethod.ARITHMETIC = Signed sum
SumMethod.ABSOLUTE = Absolute sum

config.apparentEnergyVectorSum.key = Apparent Vector Sum
config.apparentEnergyVectorSum.desc = Combine per-phase apparent power as a vector sum rather \
	than adding the magnitudes. Also changes the total power factor, which is derived from it.

config.cf2ReactiveEnergy.key = CF2 Reactive Energy
config.cf2ReactiveEnergy.desc = Output reactive energy pulses on the CF2 pin instead of apparent \
	energy pulses. Only affects that hardware output, not the reported values.

config.voltageGain.key = Voltage Gain
config.voltageGain.desc = The voltage RMS gain calibration, applied to all three phases. Raise \
	it if measured voltage reads low.

config.currentGainA.key = Current Gain A
config.currentGainA.desc = The phase A current RMS gain calibration. Raise it if measured \
	current reads low.

config.currentGainB.key = Current Gain B
config.currentGainB.desc = The phase B current RMS gain calibration. Raise it if measured \
	current reads low.

config.currentGainC.key = Current Gain C
config.currentGainC.desc = The phase C current RMS gain calibration. Raise it if measured \
	current reads low.

config.digitalPgaGain.key = Digital Gain
config.digitalPgaGain.desc = Extra digital gain applied to all four current channels after \
	filtering, for very small current signals.

DigitalPgaGain.X1 = 1x
DigitalPgaGain.X2 = 2x
DigitalPgaGain.X4 = 4x
DigitalPgaGain.X8 = 8x

config.currentGainI1.key = I1 Input Gain
config.currentGainI1.desc = Analog gain for the I1 current input, normally phase A.

config.currentGainI2.key = I2 Input Gain
config.currentGainI2.desc = Analog gain for the I2 current input, always phase B.

config.currentGainI3.key = I3 Input Gain
config.currentGainI3.desc = Analog gain for the I3 current input, normally phase C.

config.currentGainI4.key = I4 Input Gain
config.currentGainI4.desc = Analog gain for the I4 current input, the neutral line.

config.voltageGainV1.key = V1 Input Gain
config.voltageGainV1.desc = Analog gain for the V1 voltage input, phase A.

config.voltageGainV2.key = V2 Input Gain
config.voltageGainV2.desc = Analog gain for the V2 voltage input, phase B.

config.voltageGainV3.key = V3 Input Gain
config.voltageGainV3.desc = Analog gain for the V3 voltage input, phase C.

PgaGain.X1 = 1x
PgaGain.X2 = 2x
PgaGain.X4 = 4x
